# Apple default /etc/pf.conf (macOS) — the rollback target.
# firewall.sh never edits /etc/pf.conf, so rollback = sudo pfctl -f /etc/pf.conf
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"
