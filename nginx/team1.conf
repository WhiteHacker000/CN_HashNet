# Nginx Configuration for Edge Reverse Proxy & Load Balancer (Mac 2: 10.7.28.232)
# Sanitized submission copy — private certificate keys excluded for repository security.

worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream Backend Pool (Round-Robin distribution across Mac 3 and Mac 4)
    upstream team1_backends {
        server 10.7.9.142:3001;   # Backend A (Mac 3)
        server 10.7.22.224:3002;  # Backend B (Mac 4)
    }

    # Plain HTTP Server (Port 8080)
    server {
        listen 8080;
        server_name app.team1.test api.team1.test;

        location / {
            proxy_pass http://team1_backends;

            # Forward connection headers to upstream
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve upstream backend headers
            proxy_pass_header Cache-Control;
            proxy_pass_header X-Backend;
        }
    }

    # Secure HTTPS Server (Port 8443) - TLS Termination
    server {
        listen 8443 ssl;
        server_name app.team1.test api.team1.test;

        # TLS Certificate Paths (Sanitized placeholders - actual keys kept local)
        ssl_certificate     /path/to/team1-server.crt;
        ssl_certificate_key /path/to/team1-server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://team1_backends;

            # Forward client connection metadata
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward custom backend headers & caching metadata
            proxy_pass_header Cache-Control;
            proxy_pass_header X-Backend;
        }
    }
}
