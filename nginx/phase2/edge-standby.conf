# =============================================================================
# Team 1 — Phase 2 Edge (STANDBY)  —  Mac 4 (10.7.22.224)
#
# Extension E (controlled edge migration): a second, identical nginx that can
# take over app.team1.test when DNS is switched to point at Mac 4.
#
# This file is deliberately IDENTICAL to edge-primary.conf except for:
#   * X-Edge header value / edge name in JSON ("standby-mac4")
#   * pid and log file names (/tmp/team1-edge-standby-*)
# Same upstream pool, same certificate (the cert is for the NAME
# app.team1.test, not for an IP, so it is valid on any edge machine).
#
# Run on Mac 4:  ./phase2/scripts/edge.sh start standby
# NOTE: with Extension C firewall rules active, Backend A (Mac 3) only accepts
#       the primary edge. Load the cutover rules first:
#         Mac 3: ./phase2/scripts/firewall.sh apply A --with-standby
# =============================================================================

worker_processes 1;
pid        /tmp/team1-edge-standby.pid;
error_log  /tmp/team1-edge-standby-error.log notice;

events {
    worker_connections 1024;
}

http {
    default_type      application/octet-stream;
    sendfile          on;
    keepalive_timeout 65;

    log_format team1_upstream
        '$time_local client=$remote_addr "$request" status=$status '
        'upstream=[$upstream_addr] upstream_status=[$upstream_status] '
        'upstream_time=[$upstream_response_time] total=${request_time}s';
    access_log /tmp/team1-edge-standby-access.log team1_upstream;

    # ---- Extension D: backend pool with passive health checking -------------
    # max_fails=1 fail_timeout=10s:
    #   one failed attempt marks the backend "down" for 10 s. During those 10 s
    #   nginx sends nothing to it. After 10 s it lets ONE real request through
    #   as a probe; success -> back in rotation, failure -> down for another 10 s
    #   (that probe request is retried on the healthy backend, so the client
    #   still gets a 200).
    # Open-source nginx has no active (timer-driven) health checks; those need
    # NGINX Plus or a module. Passive checks + retry are enough for the demo.
    upstream team1_backends {
        server 10.7.9.142:3001  max_fails=1 fail_timeout=10s;   # Backend A (Mac 3)
        server 10.7.22.224:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
    }

    # ---- Plain HTTP (Phase 1, kept for comparison captures) -----------------
    server {
        listen 8080;
        server_name app.team1.test api.team1.test;

        error_page 502 503 504 = @upstream_down;

        location = /edge/health {
            default_type application/json;
            add_header X-Edge "standby-mac4" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"edge":"standby","host":"mac4","status":"ok"}\n';
        }

        location / {
            include proxy-common.conf;
            add_header X-Edge "standby-mac4" always;
        }

        location @upstream_down {
            default_type application/json;
            add_header X-Edge "standby-mac4" always;
            add_header Cache-Control "no-store" always;
            return 502 '{"error":"bad_gateway","edge":"standby","detail":"edge reachable (DNS, TCP and TLS OK) but no backend answered"}\n';
        }
    }

    # ---- HTTPS with TLS termination -----------------------------------------
    server {
        listen 8443 ssl;
        http2  on;
        server_name app.team1.test api.team1.test;

        # Relative paths resolve against this file's directory:
        #   nginx/phase2/certs/team1-server.crt / .key   (keys are git-ignored)
        ssl_certificate     certs/team1-server.crt;
        ssl_certificate_key certs/team1-server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        error_page 502 503 504 = @upstream_down;

        location = /edge/health {
            default_type application/json;
            add_header X-Edge "standby-mac4" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"edge":"standby","host":"mac4","status":"ok"}\n';
        }

        location / {
            include proxy-common.conf;
            add_header X-Edge "standby-mac4" always;
        }

        location @upstream_down {
            default_type application/json;
            add_header X-Edge "standby-mac4" always;
            add_header Cache-Control "no-store" always;
            return 502 '{"error":"bad_gateway","edge":"standby","detail":"edge reachable (DNS, TCP and TLS OK) but no backend answered"}\n';
        }
    }
}
