# =============================================================================
# Team 1 — Phase 2 Edge (PRIMARY)  —  Mac 2 (10.7.28.232)
#
# Changes from Phase 1 (nginx/team1.conf):
#   * Extension D: passive health checks (max_fails / fail_timeout) and
#     automatic retry on the other backend (proxy_next_upstream, see
#     proxy-common.conf)
#   * X-Edge header + /edge/health so you can tell WHICH edge answered
#     (needed for Extension E, DNS-based cutover to the standby edge)
#   * JSON 502 page when no backend is healthy ("edge up, backends down")
#   * Access log records the upstream chosen for every request
#   * Self-contained: pid/logs in /tmp, certs in ./certs/ — run with
#       nginx -c "$PWD/nginx/phase2/edge-primary.conf"
#     (or ./phase2/scripts/edge.sh start primary)
#
# The standby edge (edge-standby.conf) is identical except for X-Edge and
# the pid/log file names.
# =============================================================================

worker_processes 1;
pid        /tmp/team1-edge-primary.pid;
error_log  /tmp/team1-edge-primary-error.log notice;

events {
    worker_connections 1024;
}

http {
    default_type      application/octet-stream;
    sendfile          on;
    keepalive_timeout 65;

    log_format team1_upstream
        '$time_local client=$remote_addr "$request" status=$status '
        'upstream=[$upstream_addr] upstream_status=[$upstream_status] '
        'upstream_time=[$upstream_response_time] total=${request_time}s';
    access_log /tmp/team1-edge-primary-access.log team1_upstream;

    # ---- Extension D: backend pool with passive health checking -------------
    # max_fails=1 fail_timeout=10s:
    #   one failed attempt marks the backend "down" for 10 s. During those 10 s
    #   nginx sends nothing to it. After 10 s it lets ONE real request through
    #   as a probe; success -> back in rotation, failure -> down for another 10 s
    #   (that probe request is retried on the healthy backend, so the client
    #   still gets a 200).
    # Open-source nginx has no active (timer-driven) health checks; those need
    # NGINX Plus or a module. Passive checks + retry are enough for the demo.
    upstream team1_backends {
        server 10.7.9.142:3001  max_fails=1 fail_timeout=10s;   # Backend A (Mac 3)
        server 10.7.22.224:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
    }

    # ---- Plain HTTP (Phase 1, kept for comparison captures) -----------------
    server {
        listen 8080;
        server_name app.team1.test api.team1.test;

        error_page 502 503 504 = @upstream_down;

        location = /edge/health {
            default_type application/json;
            add_header X-Edge "primary-mac2" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"edge":"primary","host":"mac2","status":"ok"}\n';
        }

        location / {
            include proxy-common.conf;
            add_header X-Edge "primary-mac2" always;
        }

        location @upstream_down {
            default_type application/json;
            add_header X-Edge "primary-mac2" always;
            add_header Cache-Control "no-store" always;
            return 502 '{"error":"bad_gateway","edge":"primary","detail":"edge reachable (DNS, TCP and TLS OK) but no backend answered"}\n';
        }
    }

    # ---- HTTPS with TLS termination -----------------------------------------
    server {
        listen 8443 ssl;
        http2  on;
        server_name app.team1.test api.team1.test;

        # Relative paths resolve against this file's directory:
        #   nginx/phase2/certs/team1-server.crt / .key   (keys are git-ignored)
        ssl_certificate     certs/team1-server.crt;
        ssl_certificate_key certs/team1-server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        error_page 502 503 504 = @upstream_down;

        location = /edge/health {
            default_type application/json;
            add_header X-Edge "primary-mac2" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"edge":"primary","host":"mac2","status":"ok"}\n';
        }

        location / {
            include proxy-common.conf;
            add_header X-Edge "primary-mac2" always;
        }

        location @upstream_down {
            default_type application/json;
            add_header X-Edge "primary-mac2" always;
            add_header Cache-Control "no-store" always;
            return 502 '{"error":"bad_gateway","edge":"primary","detail":"edge reachable (DNS, TCP and TLS OK) but no backend answered"}\n';
        }
    }
}
