# Shared proxy settings, included by every proxied location in
# edge-primary.conf and edge-standby.conf (so both edges behave identically).

proxy_pass http://team1_backends;

# Forward the original client context to the backend (same as Phase 1)
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ---- Extension D: failure detection + failover --------------------------------
# A backend that is down is detected in one of two ways:
#   * Process stopped  -> TCP RST -> "connection refused" -> instant failure
#   * Host gone / pf drop -> no SYN-ACK -> failure after proxy_connect_timeout
proxy_connect_timeout 2s;
proxy_send_timeout    5s;
proxy_read_timeout    5s;

# If the chosen backend fails, retry the SAME client request on the next
# backend, so the client never sees the failure.
proxy_next_upstream         error timeout http_502 http_503 http_504;
proxy_next_upstream_tries   2;
proxy_next_upstream_timeout 6s;

# ---- Observability headers (for the demo / Wireshark / Extension F) ------------
# X-Backend comes from the backend itself. The headers below are added by nginx.
# X-Debug-Upstream shows every backend nginx tried for this request, e.g.
#   "10.7.9.142:3001, 10.7.22.224:3002" = A failed, request retried on B.
# (It exposes backend IPs, so it is a debug aid — remove it in production.)
add_header X-Debug-Upstream        $upstream_addr   always;
add_header X-Debug-Upstream-Status $upstream_status always;
