# =============================================================================
# Team 1 — Phase 2 dnsmasq config
# Used UNCHANGED on BOTH resolvers:
#   Primary DNS : Mac 1 (10.7.11.54)
#   Backup DNS  : Mac 3 (10.7.11.60)      <- Extension A
#
# Start with:  ./phase2/scripts/dns.sh start
# (which adds --addn-hosts=dns/phase2/team1.hosts and a pid file)
#
# Changes from Phase 1 (dns/team1.conf):
#   * Records moved from address=/.../ lines into dns/phase2/team1.hosts so a
#     record can be changed and reloaded with SIGHUP, no restart
#     (Extension B / E)
#   * local-ttl=30: answers carry TTL 30 s instead of 0, so clients cache them
#     and you can watch the cache expire (Extension B)
#   * no-resolv: never forward to whatever is in /etc/resolv.conf (avoids a
#     loop if this Mac itself points at the team DNS)
#   * local=/team1.test/: names in our zone that are not in the hosts file get
#     NXDOMAIN here instead of being sent to 8.8.8.8
# =============================================================================

# ---- Listening (same as Phase 1) ----
listen-address=0.0.0.0
bind-interfaces
port=53

# ---- Hygiene ----
domain-needed
bogus-priv
no-resolv
no-hosts

# ---- Our private zone ----
local=/team1.test/
# TTL (seconds) sent with every answer that comes from the hosts file
local-ttl=30

# ---- Public names are forwarded upstream ----
server=8.8.8.8
server=1.1.1.1

# ---- Logging: every query + answer printed in the terminal ----
log-queries
log-facility=-
