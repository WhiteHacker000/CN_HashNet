# dnsmasq configuration for Team 1 Private DNS Server (Mac 1)
# Listening on LAN interface (Port 53 UDP/TCP)

# Listen on all local network interfaces
listen-address=0.0.0.0
bind-interfaces
port=53

# Domain processing rules
domain-needed
bogus-priv

# Private Domain Mappings -> Routing traffic to Mac 2 (Edge Nginx IP: 10.7.28.232)
address=/app.team1.test/10.7.28.232
address=/api.team1.test/10.7.28.232

# Upstream Fallback Resolvers (Google & Cloudflare) for public Internet queries
server=8.8.8.8
server=1.1.1.1

# Query Logging for live debugging and packet evidence
log-queries
log-facility=-
